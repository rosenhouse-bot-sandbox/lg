name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Other jobs run unless every changed path is in $irrelevant.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          COMPARE: repos/${{ github.repository }}/compare/${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo code=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          irrelevant='CLAUDE.md
          LICENSE
          README.md
          .github/dependabot.yml
          .github/workflows/dependabot-auto-merge.yml
          .github/workflows/lg-fixture.yml
          .github/workflows/release.yml'
          # The compare API lists at most 300 files.
          files=$(gh api "$COMPARE" --jq 'if (.files | length) >= 300 then "too many files" else .files[] | .filename, .previous_filename // empty end')
          code=true
          grep -qvxF -f <(echo "$irrelevant") <<< "$files" || [ $? = 2 ] || code=false
          echo "code=$code" >> "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        env:
          GOOS: ${{ matrix.goos }}
        with:
          version: v2.15.0

  govulncheck:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install ripgrep and jq
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install ripgrep jq; else sudo apt-get update && sudo apt-get install -y ripgrep jq; fi
      - run: make test build
      - if: runner.os == 'Linux'
        run: GOOS=darwin GOARCH=arm64 go build ./...

  systemd:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Start a systemd user manager
        run: |
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          for _ in $(seq 30); do
            XDG_RUNTIME_DIR=/run/user/$(id -u) systemctl --user show-environment >/dev/null 2>&1 && exit 0
            sleep 1
          done
          exit 1
      - run: go tool ginkgo --fail-on-empty --label-filter=systemd ./e2e

  # The only required check. A skipped matrix job reports one check without
  # its matrix suffix, so requiring "test (macos-latest)" would hang.
  ci:
    if: always()
    needs: [changes, lint, govulncheck, test, systemd]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          ! grep -qwE 'failure|cancelled' <<< "$RESULTS"
